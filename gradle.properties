#
# Configuration for gradle.
#

# JVM-Options for gradle.
#
# Arguments to pass to the JVM gradle uses for the builds.
#
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Show individual warnings when building.
#
org.gradle.warning.mode=all

# Configure projects on demand.
#
# Only configure the projects the requested tasks actually need, instead of every project in the
# build. With a single module the saving is small, but it also keeps `gradle :wrapper` from
# configuring :app and thereby applying the Android Gradle Plugin, so the wrapper can be
# bootstrapped with any installed gradle rather than only one inside AGP's supported range.
#
# https://docs.gradle.org/current/userguide/multi_project_configuration_and_execution.html
#
org.gradle.configureondemand=true

# Use AndroidX package structure.
#
# AndroidX package structure is used to make it clearer which packages are bundled with the Android
# operating system, and which are packaged with the app's APK.
#
# https://developer.android.com/topic/libraries/support-library/androidx-rn
#
android.useAndroidX=true

# Use official (as opposed to obsolete) Kotlin code style for this project.
#
kotlin.code.style=official

# Enable namespacing for R classes.
#
# This enables namespacing of each library's R class so that its R class includes only the resources
# declared in the library itself and none from the library's dependencies, thereby reducing the size
# of the R class for that library.
#
android.nonTransitiveRClass=true
