espressoCore = "3.6.1"
lifecycle = "2.9.0"
activityCompose = "1.10.1"
composeBom = "2025.05.01"
navigationCompose = "2.9.0"
kotlinxSerializationJson = "1.7.3"
datastorePreferences = "1.1.7"
hilt = "2.51.1"
ksp = "2.0.20-1.0.25"
hiltNavigationCompose = "1.2.0"
ktor = "3.2.3"
slf4jAndroid = "1.7.36"
