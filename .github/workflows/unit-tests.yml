name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Set up JDK
        uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@main

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          gradle-version: 8.13

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
