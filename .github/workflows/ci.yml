name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # No gradle-version: the runner's preinstalled Gradle only bootstraps the wrapper, and
      # gradle/wrapper/gradle-wrapper.properties decides which Gradle the build itself runs on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Keep the task name qualified so it resolves to the root project's wrapper task instead of
      # matching a `wrapper` task in every project.
      - name: Generate Gradle wrapper
        run: gradle :wrapper --no-daemon

      - name: Build debug app
        run: ./gradlew assembleDebug --no-daemon

  lint:
    name: Run Android lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # No gradle-version, and the task name stays qualified; see the notes in the build job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Gradle wrapper
        run: gradle :wrapper --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # No gradle-version, and the task name stays qualified; see the notes in the build job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Gradle wrapper
        run: gradle :wrapper --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify Robolectric tests ran
        shell: bash
        run: |
          set -euo pipefail

          test_results_dir="app/build/test-results/testDebugUnitTest"
          if [[ ! -d "${test_results_dir}" ]]; then
            echo "::error::Missing unit-test results at ${test_results_dir}"
            exit 1
          fi

          for test_class in \
            AndroidManifestRobolectricTest \
            DataStoreCredentialDataSourceRobolectricTest \
            DataStoreProfileDataSourceRobolectricTest \
            DataStoreSettingsDataSourceRobolectricTest
          do
            if ! grep -R --include='TEST-*.xml' -q "${test_class}" "${test_results_dir}"; then
              echo "::error::${test_class} did not run during testDebugUnitTest"
              exit 1
            fi
          done
